<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Youth Entrepreneurship Network</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0A1240;color:#fff;font-family:system-ui,'Segoe UI',sans-serif;text-align:center;padding:2rem}
    h1{font-size:clamp(2.4rem,7vw,4.5rem);margin:0 0 1rem;letter-spacing:-.03em}
    p{margin:0 0 1.5rem;font-size:1.15rem;color:#C9D1F5}
    a{display:inline-block;background:#FFC533;color:#0F1745;font-weight:700;padding:.85rem 1.6rem;border-radius:999px;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <h1>This door doesn't lead anywhere.</h1>
    <p>The page you're looking for doesn't exist.</p>
    <a id="home" href="/">Back to the homepage</a>
  </main>
  <script>
    // On github.io project sites the homepage lives at /repo-name/, otherwise at /
    var seg = location.pathname.split('/')[1];
    if (/\.github\.io$/.test(location.hostname) && seg) document.getElementById('home').href = '/' + seg + '/';
  </script>
</body>
</html>
